name: Validate CI workflow configuration

on:
  push:
    branches:
      - ci/bootstrap-private-colony-sim
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "SECURITY.md"
      - "rae-governance.json"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "SECURITY.md"
      - "rae-governance.json"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out public CI configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run source manifest validator tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile source manifest and main-ancestor validators
        run: >-
          python -m py_compile
          scripts/validate_source_manifest.py
          scripts/validate_main_ancestor.py
          tests/test_validate_source_manifest.py
          tests/test_validate_main_ancestor.py
          scripts/validate_unbroken_frontier_manifest.py
          tests/test_validate_unbroken_frontier_manifest.py
          scripts/summarize_cargo_failure.py
          tests/test_summarize_cargo_failure.py

      - name: Validate YAML structure and guarded secret workflow
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          require "json"

          config = YAML.load_file(".github/workflows/validate-private-pr.yml")
          triggers = config["on"] || config[true]
          abort "Missing workflow_dispatch trigger" unless triggers.is_a?(Hash) && triggers.key?("workflow_dispatch")
          issue_comment = triggers["issue_comment"]
          abort "Missing created issue_comment trigger" unless issue_comment.is_a?(Hash) && issue_comment["types"] == ["created"]
          abort "Secret-bearing runner must not use push, PR, or workflow_run triggers" if (triggers.keys & %w[push pull_request pull_request_target workflow_run]).any?
          abort "Public workflow GITHUB_TOKEN must remain read-only" unless config.dig("permissions", "contents") == "read"
          jobs = config.fetch("jobs")
          %w[prepare godot ai_context report].each do |job|
            abort "Missing required job: #{job}" unless jobs.key?(job)
          end
          guard = jobs.dig("prepare", "if").to_s
          %w[github.event.issue.number == 3 github.event.comment.user.login == 'Love-DC' github.event.issue.pull_request == null].each do |required|
            abort "Missing issue-comment authorization guard: #{required}" unless guard.include?(required)
          end
          dispatch_inputs = triggers.dig("workflow_dispatch", "inputs")
          mode_options = dispatch_inputs.dig("validation_mode", "options")
          abort "Manual dispatch must support post_merge mode" unless mode_options.is_a?(Array) && mode_options.include?("post_merge")
          prepare_script = jobs.dig("prepare", "steps").to_s
          %w[COMMENT_BODY /validate-private-pr /validate-private-merge validate_main_ancestor.py /compare/].each do |required|
            abort "Missing validation command or main-ancestry check: #{required}" unless prepare_script.include?(required)
          end
          manifest = JSON.parse(File.read("rae-governance.json"))
          abort "Wrong RAE governance protocol" unless manifest["protocol"] == "rae.repository-governance"
          abort "Wrong CI repository identity" unless manifest["project"] == "ai-project-governance"
          workflow = manifest.dig("validation", "workflow")
          abort "Manifest workflow is missing" unless workflow && File.file?(workflow)
          abort "Manifest source repository mismatch" unless manifest.dig("validation", "source_repository") == "Love-DC/colony-sim"
          ai_context_steps = jobs.dig("ai_context", "steps")
          runner_checkout = ai_context_steps.find { |step| step["name"] == "Check out public CI workflow source" }
          abort "Public CI checkout must be isolated under runner/" unless runner_checkout && runner_checkout.dig("with", "path") == "runner"
          manifest_step = ai_context_steps.find { |step| step["name"] == "Validate private source governance manifest" }
          abort "Missing exact-SHA source manifest validator step" unless manifest_step && manifest_step["run"].to_s.include?("../runner/scripts/validate_source_manifest.py")
          source_validator = File.read("scripts/validate_source_manifest.py")
          %w[rae-governance.json exact_head_sha_required Love-DC/ai-project-governance].each do |required|
            abort "Missing source manifest validator rule: #{required}" unless source_validator.include?(required)
          end
          # Lambent uses a distinct public control issue and a separate repository-scoped secret.
          lambent = YAML.load_file(".github/workflows/validate-private-lambent.yml")
          lambent_triggers = lambent["on"] || lambent[true]
          abort "Lambent workflow missing workflow_dispatch" unless lambent_triggers.is_a?(Hash) && lambent_triggers.key?("workflow_dispatch")
          lambent_comment = lambent_triggers["issue_comment"]
          abort "Lambent workflow missing created issue_comment trigger" unless lambent_comment.is_a?(Hash) && lambent_comment["types"] == ["created"]
          abort "Lambent secret-bearing runner must not use untrusted triggers" if (lambent_triggers.keys & %w[push pull_request pull_request_target workflow_run]).any?
          abort "Lambent GITHUB_TOKEN must remain read-only" unless lambent.dig("permissions", "contents") == "read"
          lambent_jobs = lambent.fetch("jobs")
          %w[prepare validate report].each { |job| abort "Missing Lambent job: #{job}" unless lambent_jobs.key?(job) }
          lambent_guard = lambent_jobs.dig("prepare", "if").to_s
          %w[github.event.issue.number == 9 github.event.comment.user.login == 'Love-DC' github.event.issue.pull_request == null].each do |required|
            abort "Missing Lambent authorization guard: #{required}" unless lambent_guard.include?(required)
          end
          lambent_script = lambent_jobs.dig("prepare", "steps").to_s
          %w[LAMBENT_PRIVATE_TOKEN /validate-lambent-pr /validate-lambent-merge external-ci/lambent-governance Love-DC/Lambent].each do |required|
            abort "Missing Lambent validation safeguard: #{required}" unless lambent_script.include?(required) || lambent_jobs.dig("validate", "steps").to_s.include?(required)
          end
          lambent_manifest_step = lambent_jobs.dig("validate", "steps").find { |step| step["name"] == "Validate RAE governance manifest and required files" }
          abort "Missing exact-SHA Lambent manifest validation" unless lambent_manifest_step && lambent_manifest_step["run"].to_s.include?("validate_lambent_manifest.py")
          lambent_validator = File.read("scripts/validate_lambent_manifest.py")
          %w[rae-governance.json exact_head_sha_required external-ci/lambent-governance].each do |required|
            abort "Missing Lambent source manifest validation rule: #{required}" unless lambent_validator.include?(required)
          end
          lambent_workflow = File.read(".github/workflows/validate-private-lambent.yml")
          abort "Lambent CI workflow must target only the expected private source" unless lambent_workflow.include?("repository: Love-DC/Lambent")
          abort "Lambent PR metadata check must enforce the exact source repository" unless lambent_workflow.include?('head_repo}" != "Love-DC/Lambent"')

          # Unbroken Frontier has its own source boundary, trigger issue, secret and status contexts.
          unbroken = YAML.load_file(".github/workflows/validate-private-unbroken-frontier.yml")
          unbroken_triggers = unbroken["on"] || unbroken[true]
          abort "Unbroken Frontier workflow missing workflow_dispatch" unless unbroken_triggers.is_a?(Hash) && unbroken_triggers.key?("workflow_dispatch")
          unbroken_comment = unbroken_triggers["issue_comment"]
          abort "Unbroken Frontier workflow missing created issue_comment trigger" unless unbroken_comment.is_a?(Hash) && unbroken_comment["types"] == ["created"]
          abort "Unbroken Frontier secret-bearing runner must not use untrusted triggers" if (unbroken_triggers.keys & %w[push pull_request pull_request_target workflow_run]).any?
          abort "Unbroken Frontier GITHUB_TOKEN must remain read-only" unless unbroken.dig("permissions", "contents") == "read"
          unbroken_jobs = unbroken.fetch("jobs")
          %w[prepare resolve_dependencies windows_desktop android_arm64 ios_arm64 report].each { |job| abort "Missing Unbroken Frontier job: #{job}" unless unbroken_jobs.key?(job) }
          unbroken_concurrency = unbroken.dig("concurrency", "group").to_s
          abort "Unbroken Frontier runs must serialize by PR, SHA or control issue" unless unbroken_concurrency.include?("inputs.pr_number") && unbroken_concurrency.include?("inputs.target_sha") && unbroken_concurrency.include?("github.event.issue.number")
          unbroken_guard = unbroken_jobs.dig("prepare", "if").to_s
          %w[github.event.issue.number == 15 github.event.comment.user.login == 'Love-DC' github.event.issue.pull_request == null].each do |required|
            abort "Missing Unbroken Frontier control-issue authorization guard: #{required}" unless unbroken_guard.include?(required)
          end
          unbroken_dispatch = unbroken_triggers.dig("workflow_dispatch", "inputs")
          unbroken_modes = unbroken_dispatch.dig("validation_mode", "options")
          unbroken_suites = unbroken_dispatch.dig("suites", "options")
          abort "Unbroken Frontier manual dispatch must support post_merge" unless unbroken_modes.is_a?(Array) && unbroken_modes.include?("post_merge")
          abort "Unbroken Frontier must expose all three selectable platform suites" unless unbroken_suites.is_a?(Array) && %w[all windows android ios].all? { |suite| unbroken_suites.include?(suite) }
          unbroken_script = unbroken_jobs.dig("prepare", "steps").to_s
          %w[UNBROKEN_FRONTIER_PRIVATE_TOKEN /validate-unbroken-frontier-pr /validate-unbroken-frontier-merge Love-DC/Unbroken-Frontier /compare/].each do |required|
            abort "Missing Unbroken Frontier validation safeguard: #{required}" unless unbroken_script.include?(required)
          end
          abort "Unbroken Frontier must not reuse another project's private token" if unbroken_script.include?("COLONY_SIM_PRIVATE_TOKEN") || unbroken_script.include?("LAMBENT_PRIVATE_TOKEN")
          expected_secret = "$" + "{{ secrets.UNBROKEN_FRONTIER_PRIVATE_TOKEN }}"
          expected_runner_ref = "$" + "{{ github.sha }}"
          %w[windows_desktop android_arm64 ios_arm64].each do |job|
            step = unbroken_jobs.dig(job, "steps").find { |item| item["name"] == "Check out exact private PR HEAD" }
            abort "#{job} must check out the exact private source with the isolated token" unless step && step.dig("with", "repository") == "Love-DC/Unbroken-Frontier" && step.dig("with", "token") == expected_secret && step.dig("with", "persist-credentials") == false
          end
          unbroken_manifest = JSON.parse(File.read("rae-governance.json"))
          abort "Wrong public runner manifest identity" unless unbroken_manifest["project"] == "ai-project-governance" && unbroken_manifest.dig("validation", "source_repository") == "Love-DC/colony-sim"
          unbroken_workflow = File.read(".github/workflows/validate-private-unbroken-frontier.yml")
          abort "Private build diagnostics must stay on ephemeral runners" unless unbroken_workflow.include?("RUNNER_TEMP") && unbroken_workflow.downcase.include?("private diagnostics remain only on the ephemeral runner")
          abort "Raw Godot output must not be echoed to public logs" if unbroken_workflow.include?("$output | Write-Output")
          artifact_steps = unbroken.dig("jobs", "resolve_dependencies", "steps").select { |step| step["uses"].to_s.start_with?("actions/upload-artifact@") }
          abort "Only the exact-SHA Cargo.lock metadata may be uploaded" unless artifact_steps.length == 1 && artifact_steps.first.dig("with", "path") == "source/native/Cargo.lock"
          resolve_needs = unbroken.dig("jobs", "resolve_dependencies", "needs")
          abort "Cargo lockfile resolver must depend only on prepare" unless resolve_needs == "prepare"
          %w[windows_desktop android_arm64 ios_arm64].each do |job|
            needs = unbroken.dig("jobs", job, "needs")
            abort "#{job} must consume the exact-SHA lock resolver" unless needs.is_a?(Array) && needs.include?("resolve_dependencies")
            steps = unbroken.dig("jobs", job, "steps")
            abort "#{job} must download the shared lockfile" unless steps.any? { |step| step["uses"].to_s.start_with?("actions/download-artifact@") && step.dig("with", "name") == "unbroken-frontier-cargo-lock" }
          end
          abort "All platform builds must use the shared Cargo lockfile" unless %w[--locked].all? { |flag| unbroken_workflow.include?(flag) }
          abort "Android plugin assets path must be asserted by the AAR suite" unless unbroken_workflow.include?('setOf("addons/unbroken_frontier_native_bridge/native_bridge.gdextension")')
          abort "Third-party action references must be pinned to immutable commit SHAs" unless unbroken_workflow.scan(/^ *uses: [^ ]+@([0-9a-f]{40}) *$/).length >= 8
          abort "Private-source caching must not be added" if unbroken_workflow.include?("actions/cache@") || unbroken_workflow.include?("actions/cache/restore@")
          abort "Missing Android debug GDExtension library path" unless unbroken_workflow.include?("android.debug.arm64")
          abort "Missing Android release GDExtension library path" unless unbroken_workflow.include?("android.release.arm64")
          %w[external-ci/unbroken-frontier-windows external-ci/unbroken-frontier-android external-ci/unbroken-frontier-ios].each do |context|
            abort "Missing Unbroken Frontier status context: #{context}" unless unbroken_workflow.include?(context)
          end
          %w[windows_desktop android_arm64 ios_arm64].each do |job|
            steps = unbroken_jobs.dig(job, "steps")
            helper = steps.find { |step| step["name"] == "Check out public diagnostic helper" }
            abort "#{job} must check out the public diagnostic helper with read-only access" unless helper && helper.dig("with", "repository") == "Love-DC/ai-project-governance" && helper.dig("with", "ref") == expected_runner_ref && helper.dig("with", "path") == "runner" && helper.dig("with", "persist-credentials") == false && helper["uses"].to_s.match?(/@([0-9a-f]{40})$/)
            publisher = steps.find { |step| step["name"] == "Publish sanitized failure summary to private commit status" }
            abort "#{job} must publish its redacted summary to the private source status" unless publisher && publisher.dig("env", "UNBROKEN_FRONTIER_TOKEN") == expected_secret && publisher.to_s.include?("runner/scripts/summarize_cargo_failure.py") && publisher.to_s.include?("TARGET_SHA") && publisher.to_s.include?("RUN_URL")
            abort "#{job} must expose only the tested redacted Cargo classification in public logs" unless publisher.to_s.include?("Sanitized Cargo failure classification (redacted):")
            abort "#{job} must not print raw Cargo log contents" if publisher.to_s.match?(/(?:cat|Get-Content|Select-String)\s+.*unbroken-frontier-.*\.log/i)
          end
          report_script = unbroken_jobs.dig("report", "steps").to_s
          abort "Fallback reporting must preserve a completed platform status already published for this run" unless report_script.include?("target_url") && report_script.include?("Preserving platform-published status") && report_script.include?("current_status") && report_script.include?("current_code")
          summarizer = File.read("scripts/summarize_cargo_failure.py")
          %w[ERROR_CODE_RE CODE_GROUPS import/module resolution details withheld].each do |required|
            abort "Cargo failure summarizer is missing a redaction/classification safeguard: #{required}" unless summarizer.include?(required)
          end
          %w[TRAIT_FAMILY_PATTERNS classify_trait_family thread-safety bound GDExtension binding/conversion bound].each do |required|
            abort "Cargo failure summarizer is missing safe trait-family classification: #{required}" unless summarizer.include?(required)
          end
          unbroken_validator = File.read("scripts/validate_unbroken_frontier_manifest.py")
          %w[Love-DC/Unbroken-Frontier control_issue exact_head_sha_required external-ci/unbroken-frontier-windows external-ci/unbroken-frontier-android external-ci/unbroken-frontier-ios].each do |required|
            abort "Missing Unbroken Frontier manifest isolation rule: #{required}" unless unbroken_validator.include?(required)
          end
          puts "Colony Sim, Lambent and Unbroken Frontier CI workflow guards and manifest checks passed."
          RUBY
