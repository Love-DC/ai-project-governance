name: Validate CI workflow configuration

on:
  push:
    branches:
      - ci/bootstrap-private-colony-sim
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "SECURITY.md"
      - "rae-governance.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "SECURITY.md"
      - "rae-governance.json"

permissions:
  contents: read

jobs:
  validate-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out public CI configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate YAML structure and guarded secret workflow
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          require "json"

          config = YAML.load_file(".github/workflows/validate-private-pr.yml")
          triggers = config["on"] || config[true]
          abort "Missing workflow_dispatch trigger" unless triggers.is_a?(Hash) && triggers.key?("workflow_dispatch")
          issue_comment = triggers["issue_comment"]
          abort "Missing created issue_comment trigger" unless issue_comment.is_a?(Hash) && issue_comment["types"] == ["created"]
          abort "Secret-bearing runner must not use push, PR, or workflow_run triggers" if (triggers.keys & %w[push pull_request pull_request_target workflow_run]).any?
          abort "Public workflow GITHUB_TOKEN must remain read-only" unless config.dig("permissions", "contents") == "read"
          jobs = config.fetch("jobs")
          %w[prepare godot ai_context report].each do |job|
            abort "Missing required job: #{job}" unless jobs.key?(job)
          end
          guard = jobs.dig("prepare", "if").to_s
          %w[github.event.issue.number == 3 github.event.comment.user.login == 'Love-DC' github.event.issue.pull_request == null].each do |required|
            abort "Missing issue-comment authorization guard: #{required}" unless guard.include?(required)
          end
          prepare_script = jobs.dig("prepare", "steps").to_s
          %w[COMMENT_BODY /validate-private-pr].each do |required|
            abort "Missing comment-command parser element: #{required}" unless prepare_script.include?(required)
          end
          manifest = JSON.parse(File.read("rae-governance.json"))
          abort "Wrong RAE governance protocol" unless manifest["protocol"] == "rae.repository-governance"
          abort "Wrong CI repository identity" unless manifest["project"] == "colony-sim-ci"
          workflow = manifest.dig("validation", "workflow")
          abort "Manifest workflow is missing" unless workflow && File.file?(workflow)
          abort "Manifest source repository mismatch" unless manifest.dig("validation", "source_repository") == "Love-DC/colony-sim"
          puts "CI workflow YAML, guarded trigger safety, and RAE manifest checks passed."
          RUBY
